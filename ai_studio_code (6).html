<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NekoEmpireGame - Three.js 3D</title>
  <style>
    :root { --ink:#111; --lime:#9bff47; --pink:#ff5fa2; --blue:#53c9ff; --yellow:#ffe66d; }
    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,Arial,sans-serif}
    body{overflow:hidden;background:#0f172a}
    #app{position:fixed;inset:0}
    #ui{position:fixed;left:14px;top:14px;z-index:10;display:flex;gap:10px;align-items:flex-start}
    .panel{background:var(--yellow);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:10px;border-radius:0}
    .stats{display:flex;gap:14px}
    .st{display:flex;flex-direction:column;min-width:72px}
    .lbl{font-size:10px;font-weight:900;text-transform:uppercase}
    .val{font-size:28px;font-weight:900;line-height:1}
    .mini{font-size:14px;font-weight:800}
    #buttons{display:flex;flex-direction:column;gap:8px}
    .btn{width:52px;height:52px;background:var(--blue);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;font-weight:900;cursor:pointer}
    .btn:nth-child(2){background:var(--lime)}
    .btn:nth-child(3){background:var(--pink);color:#fff}
    #hint{position:fixed;left:14px;bottom:14px;z-index:10;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 10px;font-size:12px;font-weight:700}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui">
    <div class="panel stats">
      <div class="st"><span class="lbl">Clock</span><span class="val" id="clock">12:00</span></div>
      <div class="st"><span class="lbl">NKT</span><span class="val" id="nkt">150.000</span></div>
      <div class="st"><span class="lbl">Mode</span><span class="mini" id="mode">ROOM</span></div>
    </div>
    <div id="buttons">
      <button class="btn" id="btnDay">☀</button>
      <button class="btn" id="btnNight">🌙</button>
      <button class="btn" id="btnMove">WALK</button>
    </div>
  </div>
  <div id="hint">W/A/S/D: hareket • Mouse: kamera • Scene: full 3D (Three.js)</div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.164.1/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.164.1/examples/jsm/controls/OrbitControls.js';

    const app = document.getElementById('app');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#87ceeb');

    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
    camera.position.set(8, 6, 10);

    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;

    // Lights
    const hemi = new THREE.HemisphereLight(0xb5e9ff, 0x5e7f4e, 0.8);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(6, 12, 5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    // Sky sun sphere
    const sunGeo = new THREE.SphereGeometry(0.7, 24, 24);
    const sunMesh = new THREE.Mesh(sunGeo, new THREE.MeshBasicMaterial({ color:0xffd54f }));
    sunMesh.position.set(-15, 16, -20);
    scene.add(sunMesh);

    // Materials
    const matFloor = new THREE.MeshStandardMaterial({ color:0x9bb47d, roughness:0.95 });
    const matWall  = new THREE.MeshStandardMaterial({ color:0xf3ecde, roughness:0.9 });
    const matWood  = new THREE.MeshStandardMaterial({ color:0x8e5e3d, roughness:0.8 });
    const matDark  = new THREE.MeshStandardMaterial({ color:0x2a2a2a, roughness:0.65 });
    const matBed   = new THREE.MeshStandardMaterial({ color:0xd59cb2, roughness:0.85 });

    // Ground / room
    const floor = new THREE.Mesh(new THREE.BoxGeometry(16, .4, 12), matFloor);
    floor.position.y = -.2; floor.receiveShadow = true; scene.add(floor);

    const backWall = new THREE.Mesh(new THREE.BoxGeometry(16, 6, .35), matWall);
    backWall.position.set(0, 3, -6); backWall.receiveShadow = true; scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(.35, 6, 12), matWall);
    leftWall.position.set(-8, 3, 0); scene.add(leftWall);

    // Window (real 3D frame)
    const winFrame = new THREE.Group();
    const wf = new THREE.Mesh(new THREE.BoxGeometry(3.6, 2.3, .2), matWood);
    const glass = new THREE.Mesh(new THREE.BoxGeometry(3.1, 1.8, .08), new THREE.MeshPhysicalMaterial({ color:0x9fddff, transmission:.6, roughness:.15, transparent:true, opacity:.7 }));
    const crossH = new THREE.Mesh(new THREE.BoxGeometry(3.1, .12, .1), matWood);
    const crossV = new THREE.Mesh(new THREE.BoxGeometry(.12, 1.8, .1), matWood);
    winFrame.add(wf, glass, crossH, crossV);
    winFrame.position.set(1.8, 3.6, -5.82);
    scene.add(winFrame);

    // Doors
    function makeDoor(x, labelColor){
      const g = new THREE.Group();
      const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.9, .2), matWood);
      const leaf  = new THREE.Mesh(new THREE.BoxGeometry(1.25, 2.45, .1), new THREE.MeshStandardMaterial({ color:0xf7f7f7, roughness:.85 }));
      const sign  = new THREE.Mesh(new THREE.BoxGeometry(.65, .35, .08), new THREE.MeshStandardMaterial({ color:labelColor, roughness:.6 }));
      frame.position.z = .02; leaf.position.z = .08; sign.position.set(0, .85, .14);
      g.add(frame, leaf, sign); g.position.set(x, 1.45, -5.82);
      return g;
    }
    scene.add(makeDoor(-1.0, 0x303030));
    scene.add(makeDoor(1.0, 0x3c3c3c));

    // Kitchen block
    const kitchen = new THREE.Group();
    const fridge = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.1, 1.0), new THREE.MeshStandardMaterial({ color:0xefefef, roughness:.7 }));
    fridge.position.set(-6.8, 1.05, -4.8);
    const counter = new THREE.Mesh(new THREE.BoxGeometry(2.3, 1.0, 1.2), new THREE.MeshStandardMaterial({ color:0xcfcfcf, roughness:.7 }));
    counter.position.set(-5.0, .5, -4.9);
    const sink = new THREE.Mesh(new THREE.CylinderGeometry(.22, .22, .08, 24), matDark);
    sink.rotation.x = Math.PI/2; sink.position.set(-4.4, 1.02, -4.9);
    kitchen.add(fridge, counter, sink);
    scene.add(kitchen);

    // Bed
    const bed = new THREE.Group();
    const bedBase = new THREE.Mesh(new THREE.BoxGeometry(2.8, .5, 1.4), matWood);
    const mattress = new THREE.Mesh(new THREE.BoxGeometry(2.7, .28, 1.28), new THREE.MeshStandardMaterial({ color:0xf7f7f7, roughness:.9 }));
    const blanket = new THREE.Mesh(new THREE.BoxGeometry(1.7, .15, 1.22), matBed);
    const pillow = new THREE.Mesh(new THREE.BoxGeometry(.7, .18, .45), new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.85 }));
    bedBase.position.set(6.1, .25, -4.7);
    mattress.position.set(6.1, .63, -4.7);
    blanket.position.set(5.45, .82, -4.7);
    pillow.position.set(6.95, .85, -4.7);
    bed.add(bedBase,mattress,blanket,pillow);
    scene.add(bed);

    // TV + desk
    const stand = new THREE.Mesh(new THREE.BoxGeometry(1.4, .9, .8), matWood);
    stand.position.set(3.8, .45, -4.8);
    const tv = new THREE.Mesh(new THREE.BoxGeometry(1.2, .9, .12), new THREE.MeshStandardMaterial({ color:0x101622, emissive:0x0f2435, emissiveIntensity:.5 }));
    tv.position.set(3.8, 1.22, -4.45);
    scene.add(stand,tv);

    // Table + rug
    const rug = new THREE.Mesh(new THREE.CylinderGeometry(3.0, 3.0, .02, 40), new THREE.MeshStandardMaterial({ color:0xe8e0d2, roughness:.95 }));
    rug.position.set(0, .02, 1.2); rug.receiveShadow = true; scene.add(rug);
    const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.3, .08, .5), matWood);
    const leg1 = new THREE.Mesh(new THREE.BoxGeometry(.09, .42, .09), matDark);
    const leg2 = leg1.clone();
    tableTop.position.set(0, .53, 1.2); leg1.position.set(-.35,.3,1.2); leg2.position.set(.35,.3,1.2);
    scene.add(tableTop, leg1, leg2);

    // Garden outside + tree
    const grass = new THREE.Mesh(new THREE.BoxGeometry(20, .2, 10), new THREE.MeshStandardMaterial({ color:0x5f9440, roughness:.95 }));
    grass.position.set(0, -.1, -14); scene.add(grass);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,2.2,16), new THREE.MeshStandardMaterial({ color:0x6b4528, roughness:.85 }));
    trunk.position.set(-4.5,1.0,-14);
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(1.25,20,20), new THREE.MeshStandardMaterial({ color:0x33b86a, roughness:.8 }));
    leaf.position.set(-4.5,2.8,-14);
    scene.add(trunk, leaf);

    // Character (simple 3D cat-humanoid)
    const neko = new THREE.Group();
    const head = new THREE.Mesh(new THREE.SphereGeometry(.42,24,24), new THREE.MeshStandardMaterial({ color:0xf7d8c5, roughness:.75 }));
    const hood = new THREE.Mesh(new THREE.SphereGeometry(.49,24,24), new THREE.MeshStandardMaterial({ color:0x4a4254, roughness:.8 }));
    hood.scale.set(1.02,1.04,1.02); hood.position.y=.03;
    const ear1 = new THREE.Mesh(new THREE.ConeGeometry(.11,.22,4), new THREE.MeshStandardMaterial({ color:0x4a4254 }));
    const ear2 = ear1.clone(); ear1.position.set(-.2,.43,0); ear2.position.set(.2,.43,0); ear1.rotation.z=.18; ear2.rotation.z=-.18;
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(.26,.52,8,16), new THREE.MeshStandardMaterial({ color:0xeef3ff, roughness:.85 }));
    body.position.y = -.7;
    const legL = new THREE.Mesh(new THREE.BoxGeometry(.12,.35,.12), new THREE.MeshStandardMaterial({ color:0xffffff }));
    const legR = legL.clone(); legL.position.set(-.12,-1.1,0); legR.position.set(.12,-1.1,0);
    neko.add(hood,head,ear1,ear2,body,legL,legR);
    neko.position.set(0,1.6,0);
    scene.add(neko);

    // shadows
    scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

    // Controls (movement)
    const keys = {};
    addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let autoWalk = false;
    document.getElementById('btnMove').onclick = () => autoWalk = !autoWalk;
    document.getElementById('btnDay').onclick = () => { scene.background.set('#87ceeb'); sun.intensity=1.2; hemi.intensity=.8; };
    document.getElementById('btnNight').onclick = () => { scene.background.set('#15233f'); sun.intensity=.28; hemi.intensity=.25; };

    // fake clock
    let t = 12*60, nkt = 150000;
    setInterval(() => {
      t = (t + 10) % (24*60); nkt += 5;
      const h = String(Math.floor(t/60)).padStart(2,'0');
      const m = String(t%60).padStart(2,'0');
      document.getElementById('clock').textContent = `${h}:${m}`;
      document.getElementById('nkt').textContent = nkt.toLocaleString('tr-TR');
    }, 1200);

    const v = new THREE.Vector3();
    function animate() {
      requestAnimationFrame(animate);

      v.set(0,0,0);
      if (keys['w']) v.z -= 0.06;
      if (keys['s']) v.z += 0.06;
      if (keys['a']) v.x -= 0.06;
      if (keys['d']) v.x += 0.06;
      if (autoWalk) { v.x = Math.sin(performance.now()*0.0012)*0.025; v.z = Math.cos(performance.now()*0.0012)*0.025; }

      neko.position.add(v);
      neko.position.x = THREE.MathUtils.clamp(neko.position.x, -6.5, 6.5);
      neko.position.z = THREE.MathUtils.clamp(neko.position.z, -5.0, 4.5);

      // simple walk bounce
      const walkAmp = (Math.abs(v.x)+Math.abs(v.z))>0 ? 0.04 : 0;
      neko.position.y = 1.6 + Math.sin(performance.now()*0.02)*walkAmp;

      controls.update();
      renderer.render(scene,camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
