<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>
NEKOTOKYO: NEKO LIFE & ROBUX</title>
<style>
/* ========================================= CSS ART VARIABLES & GLOBAL SETTINGS ========================================= */ :root  {

--wood-light: #d4a373;

--wood: #a67c52;

--wood-dark: #7a5230;

--wood-shadow: #4d3319;

--wall-main: #fff0f5;

--wall-stripe: #ffe4e1;

--wall-bath: #e0f7fa;

--tile-bath: #b2ebf2;

--wall-depot: #1a1a2e;

--floor-depot: #16213e;

--accent-pink: #ff9ff3;

--accent-pink-dark: #f368e0;

--neko-skin: #ffe0d0;

--neko-skin-shadow: #f5c2b0;

--neko-hair: #ff9ff3;

--neko-hair-shadow: #d980ce;

--neko-hair-light: #ffc9fa;

--neko-eye-top: #ff007f;

--neko-eye-bot: #ffb6c1;

--glass: rgba(255,255,255,0.2);

--glass-glow: rgba(255,255,255,0.5);

--ui-bg: #faf6f0;

--ui-border: #2f3542;

}

body  {

margin: 0;

padding: 0;

overflow: hidden;

background-color: #111;

font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

display: flex;

justify-content: center;

align-items: center;

height: 100vh;

user-select: none;

}

/* Loading Screen */ #loading-screen  {

position: absolute;

top:0;

left:0;

width:100%;

height:100%;

background: #0f0f1b;

z-index: 9999;

display: flex;

flex-direction: column;

justify-content: center;

align-items: center;

color: #fff;

}

.loader-neko  {

width: 50px;

height: 50px;

background: var(--neko-hair);

border-radius: 50%;

border: 3px solid #fff;

animation: bounce 0.5s infinite alternate;

margin-bottom: 20px;

position: relative;

}

.loader-neko::before, .loader-neko::after  {

content:'';

position:absolute;

width:15px;

height:15px;

background:var(--neko-hair);

border:3px solid #fff;

top:-10px;

border-radius: 50% 50% 0 0;

}

.loader-neko::before  {

left: -5px;

transform: rotate(-30deg);

}

.loader-neko::after  {

right: -5px;

transform: rotate(30deg);

}

.progress-bar  {

width: 300px;

height: 20px;

background: #222;

border: 3px solid #fff;

border-radius: 10px;

overflow: hidden;

box-shadow: 0 0 15px rgba(255,255,255,0.2);

}

.progress-fill  {

width: 0%;

height: 100%;

background: linear-gradient(90deg, #ff9ff3, #feca57);

transition: width 0.1s;

}

#tap-to-start  {

display:none;

font-size: 24px;

cursor:pointer;

margin-top: 30px;

padding: 15px 40px;

background: linear-gradient(135deg, var(--accent-pink), #feca57);

border: 4px solid #fff;

border-radius: 30px;

font-weight: bold;

color: #fff;

text-shadow: 1px 1px 3px rgba(0,0,0,0.5);

box-shadow: 0 5px 15px rgba(0,0,0,0.4);

animation: pulseStart 1s infinite alternate;

}

#tap-to-start:active  {

transform: scale(0.95);

}

@keyframes pulseStart  {

from  {

transform: scale(1);

filter: drop-shadow(0 0 5px var(--accent-pink));

}

to  {

transform: scale(1.05);

filter: drop-shadow(0 0 20px var(--accent-pink));

}

}

@keyframes bounce  {

from  {

transform: translateY(0);

}

to  {

transform: translateY(-20px);

}

}

/* Game Wrapper */ #game-wrapper  {

width: 950px;

height: 700px;

position: relative;

background-color: #000;

overflow: hidden;

transform-origin: top left;

display: none;

box-shadow: 0 0 50px rgba(0,0,0,1);

}

#lighting-layer  {

position: absolute;

top: 0;

left: 0;

width: 100%;

height: 100%;

pointer-events: none;

z-index: 100;

transition: background-color 1s, backdrop-filter 1s;

}

/* ========================================= ROOM BACKGROUNDS & FLOORS ========================================= */ .room  {

position: absolute;

width: 100%;

height: 100%;

display: none;

}

.room.active  {

display: block;

animation: fadeIn 0.5s;

}

@keyframes fadeIn  {

from  {

opacity: 0;

}

to  {

opacity: 1;

}

}

.wall  {

position: absolute;

top: 0;

left: 0;

width: 100%;

height: 480px;

box-sizing: border-box;

border-bottom: 8px solid var(--wood-dark);

}

.floor  {

position: absolute;

top: 480px;

left: 0;

width: 100%;

height: 220px;

}

/* Main Room Decor */ #room-main .wall  {

background: repeating-linear-gradient(90deg, var(--wall-main), var(--wall-main) 40px, var(--wall-stripe) 40px, var(--wall-stripe) 80px);

box-shadow: inset 0 -40px 40px rgba(0,0,0,0.05);

}

#room-main .wall::after  {

content:'';

position:absolute;

bottom:0;

left:0;

width:100%;

height:25px;

background: var(--wood);

border-top: 3px solid var(--wood-light);

box-shadow: inset 0 5px 5px rgba(0,0,0,0.2);

}

/* Baseboard */ #room-main .floor  {

background: repeating-linear-gradient(0deg, var(--wood) 0px, var(--wood) 18px, var(--wood-dark) 18px, var(--wood-dark) 20px), repeating-linear-gradient(90deg, transparent 0, transparent 80px, rgba(0,0,0,0.1) 80px, rgba(0,0,0,0.1) 82px);

background-color: var(--wood);

box-shadow: inset 0 30px 30px rgba(0,0,0,0.3);

perspective: 1000px;

}

/* Decorative Props */ .poster  {

position: absolute;

width: 60px;

height: 80px;

background: linear-gradient(135deg, #a8c0ff, #3f2b96);

border: 3px solid #222;

top: 150px;

left: 200px;

box-shadow: 2px 5px 10px rgba(0,0,0,0.2);

border-radius: 2px;

}

.poster::after  {

content:'✨';

position:absolute;

top:20px;

left:15px;

font-size: 20px;

color:white;

}

.rug  {

position: absolute;

width: 200px;

height: 60px;

background: var(--accent-pink-dark);

border-radius: 50%;

bottom: 80px;

left: 450px;

transform: scaleY(0.5);

box-shadow: inset 0 0 10px rgba(0,0,0,0.5);

opacity: 0.8;

z-index: 1;

border: 4px dashed #fff;

}

.plant  {

position: absolute;

width: 40px;

height: 50px;

background: var(--wood-dark);

bottom: 220px;

left: 800px;

border-radius: 5px 5px 20px 20px;

border: 3px solid #111;

z-index: 5;

}

.plant-leaf  {

position: absolute;

width: 30px;

height: 30px;

background: #27ae60;

border-radius: 0 30px 0 30px;

border: 2px solid #111;

top: -20px;

left: -10px;

transform: rotate(-30deg);

box-shadow: inset 5px 5px 0 #2ecc71;

}

.plant-leaf:nth-child(2)  {

top: -25px;

left: 15px;

transform: rotate(40deg);

}

.plant-leaf:nth-child(3)  {

top: -35px;

left: 5px;

transform: rotate(10deg);

background: #2ecc71;

box-shadow: inset 5px 5px 0 #27ae60;

}

/* Bathroom Decor */ #room-bathroom .wall  {

background: repeating-linear-gradient(45deg, var(--wall-bath) 0, var(--wall-bath) 20px, var(--tile-bath) 20px, var(--tile-bath) 40px);

border-bottom: 8px solid #95a5a6;

}

#room-bathroom .floor  {

background: repeating-conic-gradient(#bdc3c7 0% 25%, #ecf0f1 0% 50%) 50% / 40px 40px;

box-shadow: inset 0 20px 30px rgba(0,0,0,0.2);

}

/* Depot Decor */ #room-depot .wall  {

background: repeating-linear-gradient(0deg, #111, #111 2px, transparent 2px, transparent 10px), linear-gradient(to bottom, #1a1a2e, #0f0f1a);

border-bottom: 8px solid #000;

}

#room-depot .floor  {

background: repeating-linear-gradient(45deg, #222 0, #222 20px, #1a1a1a 20px, #1a1a1a 40px);

border-top: 2px solid #f1c40f;

box-shadow: inset 0 30px 40px rgba(0,0,0,0.8);

}

/* ========================================= INTERACTABLE OBJECTS (HIGH DETAIL) ========================================= */ .solid-obj  {

position: absolute;

transform-origin: bottom center;

transition: filter 0.2s, transform 0.1s;

cursor: pointer;

}

.solid-obj:hover  {

filter: brightness(1.15) drop-shadow(0 0 5px rgba(255,255,255,0.3));

transform: scale(1.02);

}

.solid-obj:active  {

transform: scale(0.98);

}

/* BED */ #obj-bed  {

width: 160px;

height: 90px;

bottom: 160px;

left: 100px;

z-index: 10;

}

.bed-frame  {

position: absolute;

width: 100%;

height: 40px;

background: var(--wood);

border: 3px solid #111;

bottom: 0;

border-radius: 4px;

box-shadow: inset 0 -10px 0 var(--wood-shadow), 0 10px 20px rgba(0,0,0,0.5);

}

.bed-headboard  {

position: absolute;

width: 20px;

height: 90px;

background: var(--wood);

border: 3px solid #111;

bottom: 0;

left: 0;

border-radius: 8px 0 0 0;

box-shadow: inset -5px 0 0 var(--wood-shadow);

}

.bed-headboard::after  {

content:'';

position:absolute;

top:10px;

left:4px;

width:6px;

height:70px;

background: var(--wood-light);

}

.bed-footboard  {

position: absolute;

width: 15px;

height: 60px;

background: var(--wood);

border: 3px solid #111;

bottom: 0;

right: 0;

border-radius: 0 8px 0 0;

}

.bed-mattress  {

position: absolute;

width: 140px;

height: 35px;

background: #fff;

border: 3px solid #111;

bottom: 35px;

left: 10px;

border-radius: 5px;

}

.bed-blanket  {

position: absolute;

width: 100px;

height: 37px;

background: var(--accent-pink);

border: 3px solid #111;

border-left: none;

right: 5px;

}

.bed-blanket::before  {

content:'';

top:-3px;

/* Fold */ .bed-pillow  {

left: 25px;

}

.bed-pillow:nth-child(6)  {

}

/* DESK & PC */ #obj-desk  {

background: #111;

}

.desk-chair  {

position: absolute;

width: 45px;

}

}

.chair-pole  {

}

/* Racing stripe */ @keyframes spin  {

100%  {

transform: rotate(360deg);

}

}

}

}

}
