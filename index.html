<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEKOTOKYO: LIFE MASTER v11 3D</title>
  <style>
    :root { --panel:#111c; --accent:#ff75b5; --ok:#5bd184; --warn:#ffce56; }
    *{box-sizing:border-box} body{margin:0;overflow:hidden;background:#111;font-family:Inter,system-ui,sans-serif;color:#fff}
    #game{position:fixed;inset:0}
    #loading{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:20;font-size:28px}
    #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
    .card{background:var(--panel);border:1px solid #ffffff30;border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px)}
    #stats{position:absolute;top:12px;left:12px;min-width:240px;pointer-events:auto}
    .bar{height:12px;background:#0008;border-radius:8px;overflow:hidden;margin:6px 0}
    .fill{height:100%;transition:width .2s}
    #energyFill{background:linear-gradient(90deg,#6ae4ff,#4ec2ff)}
    #hungerFill{background:linear-gradient(90deg,#ffd36a,#ff9f42)}
    #buttons{position:absolute;right:12px;top:12px;display:flex;gap:8px;pointer-events:auto}
    button{border:0;border-radius:10px;padding:10px 12px;background:#222;color:#fff;font-weight:700;cursor:pointer;min-width:44px;min-height:44px;transition:transform .15s ease, filter .15s ease}
    button:hover{filter:brightness(1.1)}
    button:active{transform:scale(1.08)}
    #side{position:absolute;right:-360px;top:70px;width:340px;max-width:90vw;pointer-events:auto;transition:right .25s, width .25s}
    #side.open{right:12px;width:400px}
    .tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
    .list{max-height:55vh;overflow:auto;display:grid;gap:8px}
    .row{display:flex;justify-content:space-between;align-items:center;background:#0005;border-radius:8px;padding:8px;transition:transform .18s ease, background .18s ease}
    .row:hover{background:#ffffff1c}
    .row:active{transform:scale(1.03)}
    #returnBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:none;pointer-events:auto}
    #modalWrap,#robuxWrap,#fade{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30}
    #fade{background:#000;z-index:25;opacity:0;pointer-events:none;transition:opacity .4s}
    .modal{width:min(520px,92vw);background:#161a23;border:1px solid #ffffff28;border-radius:14px;padding:14px;max-height:80vh;overflow:auto}
    .modal h3{margin:0 0 8px}
    .modal .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid #555;background:#0008;color:#fff;margin:6px 0}
    .hint{font-size:12px;opacity:.8}
    .css2d-label{font-size:12px;background:#0009;border:1px solid #ffffff3a;padding:3px 6px;border-radius:6px;white-space:nowrap}
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="game"></div>
<div id="loading">Yükleniyor...</div>
<div id="ui">
  <div id="stats" class="card">
    <div id="time">Saat: 08:00</div>
    <div id="nkt">NKT: 500</div>
    <div>Enerji</div><div class="bar"><div id="energyFill" class="fill" style="width:100%"></div></div>
    <div>Açlık</div><div class="bar"><div id="hungerFill" class="fill" style="width:100%"></div></div>
    <div id="inv" class="hint">Food: 2 | Parts: 3</div>
  </div>
  <div id="buttons">
    <button id="menuBtn">☰</button>
    <button id="paletteBtn">🎨</button>
    <button id="robuxBtn">ROBUX</button>
  </div>
  <div id="side" class="card">
    <div class="tabs"><button id="shopTab">Shop</button><button id="upTab">Upgrades</button></div>
    <div id="sideList" class="list"></div>
  </div>
  <button id="returnBtn">RETURN</button>
</div>
<div id="fade"></div>
<div id="modalWrap"><div class="modal" id="modal"></div></div>
<div id="robuxWrap"><div class="modal" id="robuxModal"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const game = document.getElementById('game');
const loading = document.getElementById('loading');
const ui = {
  time:document.getElementById('time'), nkt:document.getElementById('nkt'), energy:document.getElementById('energyFill'), hunger:document.getElementById('hungerFill'), inv:document.getElementById('inv'),
  side:document.getElementById('side'), sideList:document.getElementById('sideList'), returnBtn:document.getElementById('returnBtn'),
  modalWrap:document.getElementById('modalWrap'), modal:document.getElementById('modal'), robuxWrap:document.getElementById('robuxWrap'), robuxModal:document.getElementById('robuxModal'),
  fade:document.getElementById('fade')
};

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; game.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight); labelRenderer.domElement.style.position='fixed'; labelRenderer.domElement.style.inset='0'; labelRenderer.domElement.style.pointerEvents='none'; labelRenderer.domElement.style.zIndex='9';
document.body.appendChild(labelRenderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x88c8ff);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200); camera.position.set(5,4,8);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0,1,0); controls.update();

const hemi = new THREE.HemisphereLight(0xffffff,0x334455,0.8); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff,1); dir.position.set(5,10,5); dir.castShadow=true; scene.add(dir);

const state = {
  scene:'main',
  timeMin:8*60, nkt:500, energy:100, hunger:100, food:2, parts:3,
  charState:'idle', actionEnd:0, dirtyPlate:false, wallpaper:0,
  upgrades:{tv:1,kitchen:1,bed:1,desk:1,plant:0,mirror:0,tub:0,tree:1,bench:0},
  moveTarget:null, passiveTimer:null
};

const roots = {main:new THREE.Group(), bath:new THREE.Group(), garden:new THREE.Group()};
Object.values(roots).forEach(r=>scene.add(r)); roots.bath.visible=false; roots.garden.visible=false;
const interactives = [];

function addRoomShell(root, wall=0xf2e8d8, floor=0x8f6a4f){
  const floorM = new THREE.Mesh(new THREE.BoxGeometry(12,0.2,12), new THREE.MeshStandardMaterial({color:floor})); floorM.receiveShadow=true; root.add(floorM);
  [[0,2,-6,12,4,0.2],[0,2,6,12,4,0.2],[-6,2,0,0.2,4,12],[6,2,0,0.2,4,12]].forEach(([x,y,z,w,h,d])=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:wall})); m.position.set(x,y,z); root.add(m);
  });
}
addRoomShell(roots.main,0xf8f1e5,0x9c7a55);
addRoomShell(roots.bath,0xd9effa,0x96a9b9);
const gardenGround = new THREE.Mesh(new THREE.BoxGeometry(22,0.2,16),new THREE.MeshStandardMaterial({color:0x4f9e42})); gardenGround.receiveShadow=true; roots.garden.add(gardenGround);

const windowSky = new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.5),new THREE.MeshBasicMaterial({color:0x88ccff})); windowSky.position.set(0,2.2,-5.89); roots.main.add(windowSky);
const road = new THREE.Mesh(new THREE.BoxGeometry(14,0.05,1),new THREE.MeshStandardMaterial({color:0x666666})); road.position.set(0,0.04,-2.5); roots.garden.add(road);
const car = new THREE.Mesh(new THREE.BoxGeometry(1,0.4,0.6),new THREE.MeshStandardMaterial({color:0xff4444})); car.position.set(7,0.3,-2.5); roots.garden.add(car);

function primitiveFurniture(){
  const bed = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.5,1.2),new THREE.MeshStandardMaterial({color:0xd4a6c0})); bed.position.set(3.4,0.35,2.5); bed.castShadow=true; roots.main.add(bed); addInteractive(bed,'bed',new THREE.Vector3(2.6,0,2.5));
  const kitchen = new THREE.Mesh(new THREE.BoxGeometry(2.3,1.2,0.8),new THREE.MeshStandardMaterial({color:0xcfd3d9})); kitchen.position.set(-4,0.6,3); roots.main.add(kitchen); addInteractive(kitchen,'kitchen',new THREE.Vector3(-3,0,2));
  const table = new THREE.Mesh(new THREE.BoxGeometry(1.2,0.7,1.2),new THREE.MeshStandardMaterial({color:0x8d5d3f})); table.position.set(0,0.4,0.5); roots.main.add(table); addInteractive(table,'table',new THREE.Vector3(0,0,1.5));
  const tv = new THREE.Mesh(new THREE.BoxGeometry(1,0.8,0.1),new THREE.MeshStandardMaterial({color:0x111111,emissive:0x223355})); tv.position.set(2.2,1,-1.8); roots.main.add(tv); addInteractive(tv,'tv',new THREE.Vector3(1.2,0,-1.8));
  const desk = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.8,0.7),new THREE.MeshStandardMaterial({color:0x6f4d38})); desk.position.set(-2.2,0.45,-1.8); roots.main.add(desk); addInteractive(desk,'desk',new THREE.Vector3(-1.4,0,-1.8));
  const plant = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,0.45,10),new THREE.MeshStandardMaterial({color:0x7d4f30})); plant.position.set(4.5,0.22,-2.8); roots.main.add(plant);
  const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.35,10,10),new THREE.MeshStandardMaterial({color:0x30b56c})); leaves.position.set(4.5,0.8,-2.8); roots.main.add(leaves);
  addInteractive(leaves,'plant',new THREE.Vector3(3.8,0,-2.8));
  const sink = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.7),new THREE.MeshStandardMaterial({color:0xffffff})); sink.position.set(-3.5,0.45,2.6); roots.bath.add(sink); addInteractive(sink,'sink',new THREE.Vector3(-2.8,0,2.6));
  const shower = new THREE.Mesh(new THREE.BoxGeometry(1.4,1.8,1.2),new THREE.MeshStandardMaterial({color:0x9ed5ff,transparent:true,opacity:.35})); shower.position.set(3,0.9,2.5); roots.bath.add(shower);
  const mirror = new THREE.Mesh(new THREE.PlaneGeometry(1,0.8),new THREE.MeshStandardMaterial({color:0xb5d9ff,transparent:true,opacity:.2})); mirror.position.set(-3.5,1.8,2.2); roots.bath.add(mirror); mirror.visible=false;
  objects.mirror=mirror; objects.shower=shower;
  const treeTrunk=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,2.1,8),new THREE.MeshStandardMaterial({color:0x6c4525})); treeTrunk.position.set(-5,1,-1); roots.garden.add(treeTrunk);
  const treeLeaf=new THREE.Mesh(new THREE.ConeGeometry(1.8,2.8,10),new THREE.MeshStandardMaterial({color:0x2fb85a})); treeLeaf.position.set(-5,3,-1); roots.garden.add(treeLeaf); objects.treeLeaf=treeLeaf;
  addInteractive(treeLeaf,'tree',new THREE.Vector3(-4,0,-1));
  const bench=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.25,0.6),new THREE.MeshStandardMaterial({color:0x7b5739})); bench.position.set(3,0.55,1.8); bench.visible=false; roots.garden.add(bench); objects.bench=bench; addInteractive(bench,'bench',new THREE.Vector3(2.2,0,1.8));
}

const objects={};
function addDoor(root,pos,target){
  const door=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.8,0.1),new THREE.MeshStandardMaterial({color:0x7d4a2d})); door.position.copy(pos); root.add(door); addInteractive(door,'door-'+target,null,target);
}
addDoor(roots.main,new THREE.Vector3(-0.9,0.95,-5.8),'bath'); addDoor(roots.main,new THREE.Vector3(0.9,0.95,-5.8),'garden');
addDoor(roots.bath,new THREE.Vector3(0,0.95,-5.8),'main'); addDoor(roots.garden,new THREE.Vector3(0,0.95,5.8),'main');
primitiveFurniture();

const loader = new GLTFLoader();
async function loadModel(url){return new Promise((res,rej)=>loader.load(url,g=>res(g.scene),undefined,e=>rej(e)));}
const modelUrls={
  neko:'https://www.dropbox.com/scl/fi/uxud5ggvwmr9lbsafj1i7/Neko.glb.glb?rlkey=ykd9yxe95cgp44xd052r7jktp&st=aqdjcz6c&dl=1',
  bed:'https://www.dropbox.com/scl/fi/vprkw4eczf73g0wn42nf5/Furniture3.glb?rlkey=vt6s30huk4fwzo24vw57vjm4s&st=0mp1mmd7&dl=1',
  kitchen:'https://www.dropbox.com/scl/fi/leqswmmqdci4aemwpsk13/Furniture1.glb?rlkey=173nfp2yk62tfuhd3ibiu25t0&st=j2nwcubi&dl=1'
};

const character = new THREE.Group(); character.position.set(0,0,0); scene.add(character);
const fallbackBody = new THREE.Group();
const bodyCore = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,0.8,12),new THREE.MeshStandardMaterial({color:0xffc9de}));
const bodyTop = new THREE.Mesh(new THREE.SphereGeometry(0.25,12,12),new THREE.MeshStandardMaterial({color:0xffc9de}));
const bodyBottom = new THREE.Mesh(new THREE.SphereGeometry(0.25,12,12),new THREE.MeshStandardMaterial({color:0xffc9de}));
bodyTop.position.y = 0.4;
bodyBottom.position.y = -0.4;
fallbackBody.add(bodyCore, bodyTop, bodyBottom);
fallbackBody.position.y=0.9;
fallbackBody.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
character.add(fallbackBody);
const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,0.5,6),new THREE.MeshStandardMaterial({color:0x60445a})); tail.position.set(-0.2,0.5,-0.1); tail.rotation.x=1.3; character.add(tail);
const zzzDiv=document.createElement('div'); zzzDiv.className='css2d-label'; zzzDiv.textContent='Zzz...'; zzzDiv.style.display='none';
const zzzLabel=new CSS2DObject(zzzDiv); zzzLabel.position.set(0,1.8,0); character.add(zzzLabel);

async function loadAssets(){
  let errors=[];
  try{const neko=await loadModel(modelUrls.neko); neko.scale.set(0.8,0.8,0.8); neko.traverse(o=>{if(o.isMesh){o.castShadow=true;}}); character.add(neko); fallbackBody.visible=false;}catch(e){errors.push('Neko modeli yüklenemedi');}
  try{const b=await loadModel(modelUrls.bed); b.position.set(3.4,0,2.5); b.scale.set(1.1,1.1,1.1); roots.main.add(b); objects.bedModel=b;}catch(e){errors.push('Yatak modeli yüklenemedi');}
  try{const k=await loadModel(modelUrls.kitchen); k.position.set(-4,0,3); roots.main.add(k); objects.kitchenModel=k;}catch(e){errors.push('Mutfak modeli yüklenemedi');}
  loading.textContent = errors.length ? errors.join(' | ')+' (Primitifler aktif)' : 'Hazır!';
  setTimeout(()=>loading.style.display='none',1200);
}
loadAssets();

const leafParticles = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({color:0x8cff76,size:0.08}));
const leafCount=20, leafArr=[]; for(let i=0;i<leafCount;i++) leafArr.push({x:-5+(Math.random()-0.5),y:2+Math.random()*2,z:-1+(Math.random()-0.5),vy:0.01+Math.random()*0.02});
updateLeaves(); roots.garden.add(leafParticles);
function updateLeaves(mult=1){
  const pos=[]; leafArr.forEach(p=>{p.y-=p.vy*mult*(state.upgrades.tree>1?1.8:1); p.x+=Math.sin(performance.now()*0.001+p.y)*0.005; if(p.y<0.2){p.y=2+Math.random()*2;p.x=-5+(Math.random()-0.5);p.z=-1+(Math.random()-0.5);} pos.push(p.x,p.y,p.z);});
  leafParticles.geometry.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
}
const fireParticles = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({color:0xff7b2c,size:0.07})); fireParticles.visible=false; roots.main.add(fireParticles);
function updateFire(){const p=[]; for(let i=0;i<10;i++){p.push(-4+Math.random()*0.5,1+Math.random()*0.6,3+Math.random()*0.4);} fireParticles.geometry.setAttribute('position',new THREE.Float32BufferAttribute(p,3));}

function addInteractive(mesh,type,standPos=null,doorTarget=null){
  mesh.userData={type,standPos,doorTarget}; interactives.push(mesh);
  const tag=document.createElement('div'); tag.className='css2d-label'; tag.textContent=type.replace('door-','Kapı '); const l=new CSS2DObject(tag); l.position.set(0,1,0); mesh.add(l);
}

const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2();
function onPointer(e){
  const p = e.touches?e.touches[0]:e;
  pointer.x=(p.clientX/innerWidth)*2-1; pointer.y=-(p.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(interactives.filter(m=>m.visible!==false),true);
  if(!hits.length) return;
  let obj=hits[0].object; while(obj && !obj.userData.type) obj=obj.parent; if(!obj) return;
  handleInteraction(obj.userData);
}
renderer.domElement.addEventListener('click',onPointer); renderer.domElement.addEventListener('touchstart',onPointer,{passive:true});

function handleInteraction(d){
  if(d.type.startsWith('door-')) return askDoor(d.doorTarget);
  if(state.charState==='moving') return;
  if(d.standPos) moveCharacter(d.standPos,()=>doAction(d.type)); else doAction(d.type);
}
function moveCharacter(pos,cb){ state.moveTarget=pos.clone(); state.onArrive=cb; state.charState='moving'; }
function doAction(type){
  const now=performance.now();
  const finish=(dur=1600,next='idle')=>{state.charState=next; state.actionEnd=now+dur;};
  if(type==='bed'){ finish(4000,'sleep'); }
  if(type==='kitchen') return openKitchenMenu();
  if(type==='desk'){ state.nkt+=50; state.energy-=10; finish(1800,'type'); }
  if(type==='tv'){ state.energy=Math.min(100,state.energy+10); finish(1600,'watch'); }
  if(type==='sink'){ state.energy=Math.min(100,state.energy+5); finish(1400,'wash'); }
  if(type==='bench'){ state.energy=Math.min(100,state.energy+15); finish(1800,'sit'); }
  if(type==='table'){ if(state.dirtyPlate){ state.nkt+=20; state.dirtyPlate=false; toast('Bulaşık yıkandı +20 NKT'); } }
  if(type==='tree'){ finish(1000,'idle'); }
}

function openKitchenMenu(){
  showModal('Mutfak',`<p>Ne yapmak istersin?</p><div class='actions'><button id='fridgeBtn'>Buzdolabını Aç</button><button id='cookBtn'>Yemek Pişir (2 Food)</button><button id='closeM'>Kapat</button></div>`);
  document.getElementById('fridgeBtn').onclick=()=>{ if(state.food>0){state.food--;state.hunger=Math.min(100,state.hunger+30);state.dirtyPlate=true;toast('Yemek yendi');} else toast('Food yok'); closeModal(); state.charState='eat'; state.actionEnd=performance.now()+1500; };
  document.getElementById('cookBtn').onclick=()=>{ if(state.food>=2){state.food-=2;state.hunger=100;state.energy=Math.min(100,state.energy+20);fireParticles.visible=state.upgrades.kitchen>1; toast('Pişirme başarılı'); state.charState='cook'; state.actionEnd=performance.now()+1800;} else toast('Yetersiz Food'); closeModal(); };
  document.getElementById('closeM').onclick=closeModal;
}

function askDoor(target){
  showModal('Kapı',`<p>${target==='bath'?'Banyoya':target==='garden'?'Bahçeye':'Ana Odaya'} gitmek istiyor musun?</p><div class='actions'><button id='goYes'>Evet</button><button id='goNo'>Hayır</button></div>`);
  document.getElementById('goYes').onclick=()=>{closeModal();switchScene(target)};
  document.getElementById('goNo').onclick=closeModal;
}

function switchScene(name){
  ui.fade.style.display='flex'; requestAnimationFrame(()=>ui.fade.style.opacity='1');
  setTimeout(()=>{
    state.scene=name; roots.main.visible=name==='main'; roots.bath.visible=name==='bath'; roots.garden.visible=name==='garden';
    ui.returnBtn.style.display=name==='main'?'none':'block';
    character.position.set(0,0,0);
    camera.position.set(5,4,8); controls.target.set(0,1,0); controls.update();
    ui.fade.style.opacity='0'; setTimeout(()=>ui.fade.style.display='none',380);
  },380);
}
ui.returnBtn.onclick=()=>switchScene('main');

function showModal(title,html){ ui.modal.innerHTML=`<h3>${title}</h3>${html}`; ui.modalWrap.style.display='flex'; }
function closeModal(){ ui.modalWrap.style.display='none'; }
ui.modalWrap.addEventListener('click',e=>{if(e.target===ui.modalWrap)closeModal();});
function toast(msg){ ui.time.textContent = `${formatTime()} | ${msg}`; }

function formatTime(){ const m=((state.timeMin%1440)+1440)%1440; const h=String(Math.floor(m/60)).padStart(2,'0'); const mm=String(Math.floor(m%60)).padStart(2,'0'); return `Saat: ${h}:${mm}`; }
function isNight(){ const h=(state.timeMin/60)%24; return h>=22||h<6; }
function gotoBed(){ if(state.scene!=='main') switchScene('main'); moveCharacter(new THREE.Vector3(2.6,0,2.5),()=>{state.charState='sleep';state.actionEnd=performance.now()+6000;}); }

function tick(){
  state.timeMin+=10; if(state.charState==='idle'){state.hunger-=0.5;state.energy-=0.3;} state.nkt+=5;
  if(state.charState==='sleep'){state.energy=Math.min(100,state.energy+2);} state.hunger=Math.max(0,state.hunger); state.energy=Math.max(0,state.energy);
  if((state.energy<20 || isNight()) && state.charState==='idle') gotoBed();
  renderUI();
}
state.passiveTimer=setInterval(tick,2000);

function renderUI(){
  ui.time.textContent=formatTime(); ui.nkt.textContent=`NKT: ${Math.floor(state.nkt)}`; ui.energy.style.width=`${state.energy}%`; ui.hunger.style.width=`${state.hunger}%`;
  ui.inv.textContent=`Food: ${state.food} | Parts: ${state.parts}`;
}
renderUI();

const shopItems=[{k:'food',name:'Food',cost:50,add:1},{k:'parts',name:'Parts',cost:100,add:1}];
const upInfo={tv:{max:2,cost:1},kitchen:{max:2,cost:1},bed:{max:2,cost:1},desk:{max:2,cost:1},plant:{max:2,cost:1},mirror:{max:1,cost:1},tub:{max:1,cost:1},tree:{max:2,cost:1},bench:{max:1,cost:1}};
let sideTab='shop';
function drawSide(){
  ui.sideList.innerHTML='';
  if(sideTab==='shop') shopItems.forEach(i=>{const d=document.createElement('div'); d.className='row'; d.innerHTML=`<span>${i.name} (${i.cost} NKT)</span><button>Satın Al</button>`; d.querySelector('button').onclick=()=>{if(state.nkt>=i.cost){state.nkt-=i.cost;state[i.k]+=i.add;renderUI();}else toast('NKT yetersiz')}; ui.sideList.appendChild(d);});
  if(sideTab==='up') Object.entries(upInfo).forEach(([k,v])=>{const lv=state.upgrades[k]||0; const d=document.createElement('div'); d.className='row'; d.innerHTML=`<span>${k} Lv.${lv}/${v.max}</span><button>+ (${v.cost} Part)</button>`; d.querySelector('button').onclick=()=>upgrade(k,v); ui.sideList.appendChild(d);});
}
function upgrade(k,info){ if((state.upgrades[k]||0)>=info.max) return; if(state.parts<info.cost) return toast('Part yetersiz'); state.parts-=info.cost; state.upgrades[k]=(state.upgrades[k]||0)+1;
  if(k==='tv') interactives.find(x=>x.userData.type==='tv')?.scale.setScalar(state.upgrades.tv===2?1.4:1);
  if(k==='kitchen') fireParticles.visible=true;
  if(k==='bed'){ const b=interactives.find(x=>x.userData.type==='bed'); if(b) b.scale.set(state.upgrades.bed===2?1.4:1,1,state.upgrades.bed===2?1.2:1); }
  if(k==='desk'){ const d=interactives.find(x=>x.userData.type==='desk'); if(d) d.material.emissive.setHex(state.upgrades.desk===2?0x44ffdd:0x000000); }
  if(k==='plant'){ const p=interactives.find(x=>x.userData.type==='plant'); if(p) p.scale.setScalar(1+state.upgrades.plant*0.4); }
  if(k==='mirror'&&objects.mirror) objects.mirror.visible=true;
  if(k==='tub'&&objects.shower){ objects.shower.visible=false; const tub=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.5,0.8),new THREE.MeshStandardMaterial({color:0xffffff})); tub.position.set(3,0.25,2.5); roots.bath.add(tub); }
  if(k==='tree'&&objects.treeLeaf){ objects.treeLeaf.scale.setScalar(state.upgrades.tree===2?1.6:1); }
  if(k==='bench'&&objects.bench){ objects.bench.visible=true; }
  drawSide(); renderUI();
}

document.getElementById('menuBtn').onclick=()=>{ui.side.classList.toggle('open'); drawSide();};
document.getElementById('shopTab').onclick=()=>{sideTab='shop';drawSide();}; document.getElementById('upTab').onclick=()=>{sideTab='up';drawSide();};
const wallpapers=[0xf8f1e5,0xefe3ff,0xdaf4ea];
document.getElementById('paletteBtn').onclick=()=>{state.wallpaper=(state.wallpaper+1)%3; roots.main.children.forEach(c=>{if(c.geometry?.parameters?.height===4 && c.geometry?.parameters?.depth===0.2) c.material.color.setHex(wallpapers[state.wallpaper]);});};

const robuxBtn=document.getElementById('robuxBtn');
robuxBtn.onclick=()=>openRobuxModal();
function openRobuxModal(){
  ui.robuxWrap.style.display='flex';
  ui.robuxModal.innerHTML=`<h3>Roblox Entegrasyonu</h3><input id='rbUser' placeholder='Roblox kullanıcı adı'><div class='actions'><button id='rbFind'>Bul</button><button id='rbClose'>Kapat</button></div><div id='rbOut' class='hint'></div>`;
  document.getElementById('rbClose').onclick=()=>ui.robuxWrap.style.display='none';
  document.getElementById('rbFind').onclick=fetchRoblox;
}
async function fetchRoblox(){
  const out=document.getElementById('rbOut'); const uname=document.getElementById('rbUser').value.trim(); if(!uname) return out.textContent='Kullanıcı adı girin';
  out.textContent='Yükleniyor...';
  try{
    const uRes=await fetch('https://users.roproxy.com/v1/usernames/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usernames:[uname],excludeBannedUsers:true})});
    if(!uRes.ok) throw new Error('Kullanıcı API hatası');
    const uData=await uRes.json(); const user=uData.data?.[0]; if(!user?.id) throw new Error('Kullanıcı bulunamadı');
    const thumb=await (await fetch(`https://thumbnails.roproxy.com/v1/users/avatar-headshot?userIds=${user.id}&size=150x150&format=Png&isCircular=true`)).json();
    const img=thumb.data?.[0]?.imageUrl||'';
    out.innerHTML=`<div><img src='${img}' width='64' height='64' style='border-radius:50%'><p>${user.name} onaylıyor musun?</p><button id='rbYes'>Onayla</button></div>`;
    document.getElementById('rbYes').onclick=()=>listPasses(user.id,out);
  }catch(err){ out.textContent=`Hata: ${err.message}. Lütfen tekrar deneyin.`; }
}
async function listPasses(userId,out){
  out.textContent='Gamepassler yükleniyor...';
  try{
    const gamesRes=await fetch(`https://games.roproxy.com/v2/users/${userId}/games?accessFilter=Public&sortOrder=Asc&limit=50`);
    if(!gamesRes.ok) throw new Error('Oyunlar alınamadı');
    const games=(await gamesRes.json()).data||[];
    const passes=[];
    for(const g of games){
      try{const pRes=await fetch(`https://games.roproxy.com/v1/games/${g.id}/game-passes?limit=50`); if(!pRes.ok) continue; const pdata=(await pRes.json()).data||[]; pdata.forEach(p=>passes.push({name:p.name,price:p.price||0}));}
      catch{}
    }
    if(!passes.length) throw new Error('Gamepass bulunamadı');
    out.innerHTML=passes.slice(0,60).map((p,i)=>`<div class='row'><span>${p.name} - ${p.price} R$</span><button data-i='${i}'>Buy</button></div>`).join('');
    out.querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=passes[+b.dataset.i]; const cost=p.price*10000; if(state.nkt>=cost){state.nkt-=cost; renderUI(); alert('Başarıyla satın alındı! Robux hesabınıza eklenecektir.');} else alert('NKT yetersiz');});
  }catch(err){ out.textContent=`Hata: ${err.message}. API yanıt vermiyor olabilir.`; }
}
ui.robuxWrap.addEventListener('click',e=>{if(e.target===ui.robuxWrap)ui.robuxWrap.style.display='none';});

function animate(t){
  requestAnimationFrame(animate);
  if(state.moveTarget){ character.position.lerp(state.moveTarget,0.08); character.rotation.y = state.moveTarget.x < character.position.x ? Math.PI : 0;
    if(character.position.distanceTo(state.moveTarget)<0.08){ character.position.copy(state.moveTarget); state.moveTarget=null; const cb=state.onArrive; state.onArrive=null; cb&&cb(); }
  }
  if(state.charState!=='moving' && performance.now()>state.actionEnd && state.charState!=='sleep') state.charState='idle';
  const tt=t*0.001;
  character.scale.set(1,1,1); character.rotation.z=0; zzzDiv.style.display='none';
  if(state.charState==='idle'){ character.position.y=Math.sin(tt*2)*0.02; tail.rotation.z=Math.sin(tt*2)*0.2; }
  if(state.charState==='moving'){ character.position.y=Math.sin(tt*12)*0.03; character.rotation.z=Math.sin(tt*12)*0.05; }
  if(state.charState==='sit'||state.charState==='watch'){ character.scale.y=0.6; character.position.y-=0.3; character.position.z+=0.2; }
  if(state.charState==='sleep'){ character.rotation.z=Math.PI/2; character.scale.y=0.5; character.position.y-=0.4; zzzDiv.style.display='block'; if(performance.now()>state.actionEnd){state.charState='idle';}}
  if(state.charState==='cook'||state.charState==='wash'){ character.rotation.x=Math.sin(tt*8)*0.15; }
  if(state.charState==='type'){ character.rotation.x=0.2; }
  fireParticles.visible = state.upgrades.kitchen>1 && (state.charState==='cook'); if(fireParticles.visible) updateFire();
  updateLeaves(1);
  car.position.x -=0.06; if(car.position.x<-7) car.position.x=7;
  const night=isNight(); hemi.intensity=night?0.3:0.8; dir.intensity=night?0.35:1; scene.background.setHex(night?0x0f1a2f:0x88c8ff); windowSky.material.color.setHex(night?0x1f2f5f:0x88ccff);
  renderer.render(scene,camera); labelRenderer.render(scene,camera);
}
animate(0);

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);});
</script>
